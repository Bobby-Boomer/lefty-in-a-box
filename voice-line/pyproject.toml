[project]
name = "voice-line"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "pynput>=1.8.2",
    "setuptools<81",
    "sounddevice>=0.5.5",
    "webrtcvad>=2.0.10",
]

# The voice line is a folder of scripts, not an installable package. Until 2026-11-15 this
# file declared a build backend and a `voice_line` entry point whose code was never in the
# repo, so `uv sync` on a fresh clone failed with "Expected a Python module at
# src/voice_line/__init__.py" and the installer stopped. package = false means uv just
# installs the dependencies.
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "services/kokoro",
]
