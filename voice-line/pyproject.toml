[project]
name = "voice-line"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "pynput>=1.8.2",
    "setuptools<81",
    "sounddevice>=0.5.5",
    "webrtcvad>=2.0.10",
]

[project.scripts]
voice-line = "voice_line:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "services/kokoro",
]
